<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="main-style.css">
    <title>Recipe Creation</title>
    <script defer src="https://unpkg.com/dexie/dist/dexie.js"></script>
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script defer src="../kubejs-json-converter/kubejs-simple/converter.js"></script>
    <script defer src="shared.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/interactjs@1.10.27/dist/interact.min.js"></script>
    <script defer src="items-hook.js"></script>
    <script defer src="recipe-types.js"></script>
    <script defer src="recipe-model.js"></script>
    <script defer src="recipe-create.js"></script>
    <script src="lightnessInverter.js"></script>
</head>
<body>
    <div class="sidebars">
        <div class="left-sidebar">
            <a><button id="btn-upload-scripts">Upload Scripts</button></a>
            <a><button id="btn-download-scripts">Download Scripts</button></a>
            <a><button id="btn-dark-mode" onclick="toggleDarkMode()">Toggle Dark Mode</button></a>
        </div>
        <div class="right-sidebar">
            <a href="recipe-create.html" class="active">Recipe Creation</a>
            <a href="my-recipes.html">My Recipes</a>
            <a href="item-create.html">Item Creation</a>
            <a href="loot-edit.html">Loot Tables</a>
        </div>
    </div>

    <div class="main page">
        <h1 class="page-title">Recipe Creation</h1>

        <div class="craft-area">
            <div class="recipe-controls">
                <select id="recipe-type">
                    <option value="crafting">Crafting</option>
                    <option value="smithing">Smithing</option>
                    <option value="smelting">Smelting</option>
                    <option value="blasting">Blasting</option>
                    <option value="smoking">Smoking</option>
                    <option value="campfire_cooking">Campfire cooking</option>
                    <option value="stonecutting">Stonecutting</option>
                    <option value="custom">Custom</option>
                </select>
                <label id="shapeless-label"><input type="checkbox" id="shapeless-toggle"> enable shapeless</label>
            </div>

            <div class="grid-container" id="craft-layout">
                <div class="input-grid" id="input-area"></div>

                <span class="grid-arrow">→</span>

                <div class="output-grid">
                    <div class="output-wrap">
                        <div class="output-cell" data-slot="out"></div>
                        <input class="output-count" id="output-count" type="number" min="1" max="64" step="1" value="1" title="Output count (1-64)">
                    </div>
                </div>
            </div>

            <div class="extra-fields" id="extra-fields" hidden>
                <div>
                <p class="note">Exp</p>
                <input id="xp-input" type="number" min="0" step="any" placeholder="0">
                </div>
                <div>
                <p class="note">Cooking time in ticks (1/20th second)</p>
                <input id="cooking-time-input" type="number" min="0" step="1" placeholder="200">
                </div>
            </div>

            <div class="custom-area" id="custom-area" hidden>
                <textarea id="custom-json" spellcheck="false" placeholder='datapack recipe json, for example {"type": "farmersdelight:cutting", ...}'></textarea>
            </div>

            <div class="recipe-actions">
                <button id="save-recipe">Save Recipe</button>
                <span id="save-status"></span>
            </div>
        </div>

        <div class="palette-section" id="palette-section">
            <div class="palette-header">
                <input id="palette-search" type="search" placeholder="Search items">
                <select id="palette-type">
                    <option value="item">Items</option>
                    <option value="fluid">Fluids</option>
                </select>
                <span class="palette-status" id="palette-status">Loading items...</span>
            </div>
            <div class="palette-grid" id="palette-grid"></div>
        </div>
    </div>
    <div class="item-tooltip" id="item-tooltip"></div>
</body>
</html>
